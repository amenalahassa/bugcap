name: Test and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python-version }} --extra dev ruff check src tests
      - run: uv run --python ${{ matrix.python-version }} --extra dev --extra mcp pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run python -c "import bugcap; print(bugcap.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
