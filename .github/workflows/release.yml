name: Test and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --python ${{ matrix.python-version }} --extra dev ruff check src tests
      - run: uv run --python ${{ matrix.python-version }} --extra dev --extra mcp pytest -v -o faulthandler_timeout=120

  # The image Glama builds to check the MCP server (see Dockerfile); a release that would not
  # start there, or whose tool definitions regress, fails here before reaching PyPI.
  mcp-image:
    name: MCP server image (Docker + TDQS lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: docker build -t bugcap-mcp .
      - run: uv run --extra mcp python scripts/docker_smoke.py bugcap-mcp
      - run: npx -y mcp-tdqs lint --command "uv run --extra mcp bugcap mcp-serve" --fail-on warning

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mcp-image]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run python -c "import bugcap; print(bugcap.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
