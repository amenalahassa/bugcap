version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # 2.x breaks the MCP server; see the "Support the mcp SDK 2.x" issue.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
